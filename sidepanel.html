<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yandex Ads Scraper</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="panel">

    <!-- Header -->
    <div class="panel-header">
      <h1>Сбор рекламы</h1>
      <div id="totalBadge" class="total-badge hidden">0</div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="manual">Вручную</button>
      <button class="tab-btn" data-tab="batch">Пакетный</button>
    </div>

    <!-- ── Manual tab ── -->
    <div id="tab-manual" class="tab-content">
      <div class="panel-controls">
        <button id="collectBtn" class="collect-button">Собрать рекламу</button>
        <div id="status" class="status hidden"></div>
      </div>
      <div id="notYandex" class="warning hidden">
        Откройте страницу поиска Яндекса
      </div>
    </div>

    <!-- ── Batch tab ── -->
    <div id="tab-batch" class="tab-content hidden">
      <div class="panel-controls">
        <textarea
          id="batchQueries"
          class="batch-textarea"
          placeholder="Введите запросы — каждый с новой строки, через запятую или точку с запятой:&#10;&#10;натяжной потолок москва&#10;ремонт квартир спб&#10;окна пвх цена"
          rows="6"
        ></textarea>
        <div class="domain-selector">
          <label class="domain-label">Домен:</label>
          <label class="domain-option">
            <input type="radio" name="batchDomain" value="ya.ru" checked> ya.ru
          </label>
          <label class="domain-option">
            <input type="radio" name="batchDomain" value="yandex.ru"> yandex.ru
          </label>
        </div>
        <div id="batchStatus" class="status hidden"></div>
        <div class="batch-actions">
          <button id="batchStartBtn" class="collect-button">▶ Старт</button>
          <button id="batchStopBtn" class="btn-stop hidden">■ Стоп</button>
        </div>
        <div id="batchProgress" class="batch-progress hidden">
          <div class="progress-bar-wrap">
            <div id="progressBar" class="progress-bar"></div>
          </div>
          <div id="progressText" class="progress-text"></div>
        </div>
      </div>
    </div>

    <!-- ── Sessions (shared) ── -->
    <div id="sessionsContainer" class="sessions-container hidden">
      <div class="sessions-toolbar">
        <span id="sessionsCount" class="sessions-count"></span>
        <div class="toolbar-actions">
          <button id="copyAllBtn" class="btn-copy-all">📋 URL</button>
          <button id="downloadAllBtn" class="btn-download-all">↓ JSON</button>
          <button id="csvAllBtn" class="btn-csv-all">↓ CSV</button>
          <button id="clearAllBtn" class="btn-clear">✕ Очистить</button>
        </div>
      </div>
      <div id="sessionsList" class="sessions-list"></div>
    </div>

    <!-- Empty state -->
    <div id="emptyState" class="empty-state">
      <div class="empty-icon">🔍</div>
      <div class="empty-text">Откройте поиск Яндекса<br>и нажмите «Собрать рекламу»</div>
    </div>

  </div>
  <script src="punycode.js"></script>
  <script src="utils.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
